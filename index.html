<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Parking Simulator — driver's seat</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16181c;
        color: #e6e6e6;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #viewport {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud,
      #controls {
        position: fixed;
        left: 12px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        white-space: pre;
      }
      #hud {
        top: 12px;
      }
      #controls {
        bottom: 12px;
        opacity: 0.75;
      }
      .hud-rack {
        position: relative;
        width: 180px;
        height: 8px;
        margin: 6px 0 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      .hud-rack-centre {
        position: absolute;
        left: 50%;
        top: -2px;
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.45);
      }
      .hud-rack-needle {
        position: absolute;
        top: -3px;
        width: 4px;
        height: 14px;
        margin-left: -2px;
        border-radius: 2px;
        background: #6fd3ff;
      }
      .hud-scenario {
        opacity: 0.8;
        max-width: 70ch;
      }
      .hud-lock {
        opacity: 0.85;
      }
      /* Contact cue: centred high enough to be seen without covering the bay. */
      #cue {
        position: fixed;
        top: 22%;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      .contact-banner {
        padding: 7px 14px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 15px;
        letter-spacing: 0.04em;
        white-space: pre;
        transition: opacity 60ms linear;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="hud"></div>
    <div id="cue"></div>
    <div id="controls">W/S throttle &amp; brake   A/D steer   F/N/R gear   Space handbrake
mouse look (click to capture)   Q/E look left/right   C look back   Z recentre   V top-down
M select mirror   I/J/K/L aim it   O reset aim   Backspace restart scenario</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
