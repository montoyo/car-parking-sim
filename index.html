<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Parking Simulator — debug skeleton</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16181c;
        color: #e6e6e6;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #viewport {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud,
      #controls {
        position: fixed;
        left: 12px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        white-space: pre;
      }
      #hud {
        top: 12px;
      }
      #controls {
        bottom: 12px;
        opacity: 0.75;
      }
      .hud-rack {
        position: relative;
        width: 180px;
        height: 8px;
        margin: 6px 0 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      .hud-rack-centre {
        position: absolute;
        left: 50%;
        top: -2px;
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.45);
      }
      .hud-rack-needle {
        position: absolute;
        top: -3px;
        width: 4px;
        height: 14px;
        margin-left: -2px;
        border-radius: 2px;
        background: #6fd3ff;
      }
      .hud-lock {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="hud"></div>
    <div id="controls">W/S throttle &amp; brake   A/D steer   F/N/R gear   Space handbrake</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
